
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#fff1f5">

    <title>กอดนี้ให้แม่ ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;
        }

        body {

            font-family:
                Arial,
                "Tahoma",
                sans-serif;

            min-height: 100dvh;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    #fffaf8 0%,
                    #ffe9ee 50%,
                    #ffdce5 100%
                );

            color: #704b52;
        }

        .hug-content {

            width: 90%;

            max-width: 550px;

            position: relative;

            z-index: 10;

            animation:
                contentIn 1.5s ease;
        }

        .hug-icon {

            font-size:
                clamp(
                    90px,
                    25vw,
                    140px
                );

            margin-bottom: 10px;

            animation:
                hugAnimation
                1.8s
                ease-in-out
                infinite;
        }

        h1 {

            font-size:
                clamp(
                    30px,
                    8vw,
                    42px
                );

            color: #87545d;

            margin:
                10px 0
                18px;
        }

        p {

            font-size:
                clamp(
                    17px,
                    4.8vw,
                    21px
                );

            line-height: 1.8;

            margin:
                8px 0;
        }

        h2 {

            font-size:
                clamp(
                    23px,
                    6vw,
                    30px
                );

            color: #b34f68;

            margin:
                20px 0
                30px;
        }

        /* ปุ่ม */

        .next-button {

            display: inline-block;

            text-decoration: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #e8a0a0,
                    #d88498
                );

            padding:
                15px
                25px;

            border-radius: 50px;

            font-size: 18px;

            font-weight: bold;

            box-shadow:
                0 8px 20px
                rgba(
                    180,
                    100,
                    120,
                    0.2
                );

            transition:
                transform 0.3s ease;
        }

        .next-button:hover {

            transform:
                scale(1.06);
        }

        /* ดอกไม้ */

        .flower {

            position: fixed;

            bottom: -70px;

            font-size: 30px;

            pointer-events: none;

            z-index: 2;

            animation:
                floatUp
                8s
                linear
                infinite;
        }

        .flower1 {

            left: 8%;

            animation-delay: 0s;
        }

        .flower2 {

            left: 80%;

            animation-delay: 2s;
        }

        .flower3 {

            left: 25%;

            animation-delay: 4s;
        }

        .flower4 {

            left: 60%;

            animation-delay: 1s;
        }

        /* หัวใจ */

        .heart {

            position: fixed;

            bottom: -60px;

            font-size: 25px;

            pointer-events: none;

            z-index: 2;

            animation:
                floatUp
                7s
                linear
                infinite;
        }

        .heart1 {

            left: 15%;

            animation-delay: 1s;
        }

        .heart2 {

            left: 70%;

            animation-delay: 3s;
        }

        .heart3 {

            left: 45%;

            animation-delay: 5s;
        }

        /* Animation กอด */

        @keyframes hugAnimation {

            0% {

                transform:
                    scale(1)
                    rotate(-2deg);
            }

            50% {

                transform:
                    scale(1.15)
                    rotate(2deg);
            }

            100% {

                transform:
                    scale(1)
                    rotate(-2deg);
            }
        }

        @keyframes contentIn {

            from {

                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(180deg);

                opacity: 0;
            }
        }

        /* iPhone */

        @media (max-width: 600px) {

            .hug-content {

                width: 90%;
            }

            .hug-icon {

                font-size: 90px;
            }

            .next-button {

                width: 85%;

                max-width: 320px;

                font-size: 17px;
            }
        }

        @media (max-height: 700px) {

            .hug-icon {

                font-size: 75px;
            }

            h1 {

                margin:
                    5px 0
                    10px;
            }

            p {

                line-height: 1.6;
            }

            h2 {

                margin:
                    12px 0
                    18px;
            }
        }

    </style>

</head>


<body>


    <!-- ดอกไม้ -->

    <div class="flower flower1">
        🌸
    </div>

    <div class="flower flower2">
        🌷
    </div>

    <div class="flower flower3">
        🌼
    </div>

    <div class="flower flower4">
        🌺
    </div>


    <!-- หัวใจ -->

    <div class="heart heart1">
        ❤️
    </div>

    <div class="heart heart2">
        💕
    </div>

    <div class="heart heart3">
        💗
    </div>


    <!-- เนื้อหา -->

    <main class="hug-content">

        <div class="hug-icon">
            🫂
        </div>

        <h1>
            กอดนี้ให้แม่นะ ❤️
        </h1>

        <p>
            หนูรักแม่มาก ๆ
        </p>

        <p>
            เอาจริง ๆ หนูก็บอกแม่<br>
            ทุกวันอยู่แล้วละ 😂❤️
        </p>

        <p>
            แต่วันนี้หนูอยากบอกอีกครั้งว่า
        </p>

        <h2>
            หนูรักแม่ที่สุดเลย ❤️
        </h2>


        <a
            href="message.html"
            class="next-button">

            💌 มีอะไรอยากบอกแม่อีก

        </a>

    </main>


</body>

</html>
